[project]
name = "ptopchat"
version = "0.1.0"
description = "Peer-to-peer chat between two local networks"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ptopchat = "ptopchat.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
